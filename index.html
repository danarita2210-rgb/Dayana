<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Inflación Anual</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts & Lucide Icons -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
  <script src="https://unpkg.com/lucide-react"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { 
      AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, 
      Tooltip, ResponsiveContainer, ReferenceArea, ReferenceLine 
    } = window.Recharts;

    const INFLATION_DATA = [
      { year: '2019', rate: 2.3, range: '2.3%', status: 'within', note: 'Dentro del rango meta' },
      { year: '2020', rate: 1.4, range: '1.4%', status: 'within', note: 'Efecto de la crisis sanitaria y menor demanda' },
      { year: '2021', rate: 7.0, range: '7.0%', status: 'above', note: 'Pico máximo del periodo por rebote económico y presiones de costos' },
      { year: '2022', rate: 6.5, range: '6.5%', status: 'above', note: 'Elevadas presiones inflacionarias globales' },
      { year: '2023', rate: 3.4, range: '3.4%', status: 'above', note: 'Inicio de desaceleración progresiva' },
      { year: '2024', rate: 2.9, range: '2.9%', status: 'within', note: 'Retorno exitoso al rango meta (2.9%)' },
      { year: '2025', rate: 2.7, range: '2.7%', status: 'within', note: 'Consolidación dentro del rango meta (2.7%)' },
      { year: '2026', rate: 3.4, range: '3.4%', status: 'above', note: 'Último dato registrado (3.4%)' },
    ];

    function App() {
      const [chartType, setChartType] = useState('area');
      const [searchTerm, setSearchTerm] = useState('');
      const [calculatorAmount, setCalculatorAmount] = useState(1000);
      const [selectedStartYear, setSelectedStartYear] = useState('2019');

      const metrics = useMemo(() => {
        const total = INFLATION_DATA.reduce((acc, curr) => acc + curr.rate, 0);
        const avg = (total / INFLATION_DATA.length).toFixed(2);
        const peak = [...INFLATION_DATA].sort((a, b) => b.rate - a.rate)[0];
        const latest = INFLATION_DATA[INFLATION_DATA.length - 1];
        const withinTargetCount = INFLATION_DATA.filter(d => d.rate >= 1.0 && d.rate <= 3.0).length;
        const withinTargetPct = Math.round((withinTargetCount / INFLATION_DATA.length) * 100);

        return { avg, peak, latest, withinTargetCount, withinTargetPct };
      }, []);

      const filteredData = useMemo(() => {
        return INFLATION_DATA.filter(item => 
          item.year.includes(searchTerm) ||
          item.range.includes(searchTerm) ||
          item.note.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [searchTerm]);

      const calculatePurchasingPower = useMemo(() => {
        const startIndex = INFLATION_DATA.findIndex(d => d.year === selectedStartYear);
        if (startIndex === -1) return { lostPower: '0.00', currentValue: calculatorAmount.toFixed(2), cumulativeInflation: '0.0' };

        let cumulativeFactor = 1;
        for (let i = startIndex; i < INFLATION_DATA.length; i++) {
          cumulativeFactor *= (1 + INFLATION_DATA[i].rate / 100);
        }

        const currentValue = calculatorAmount / cumulativeFactor;
        const lostPower = calculatorAmount - currentValue;
        const cumulativeInflation = ((cumulativeFactor - 1) * 100).toFixed(1);

        return {
          currentValue: currentValue.toFixed(2),
          lostPower: lostPower.toFixed(2),
          cumulativeInflation
        };
      }, [calculatorAmount, selectedStartYear]);

      return (
        <div className="p-4 sm:p-8 max-w-7xl mx-auto space-y-6">
          <header className="border-b border-slate-800 pb-6">
            <h1 className="text-3xl font-extrabold text-white">Dashboard de Inflación Anual (CPI)</h1>
            <p className="text-slate-400 text-sm mt-1">Análisis de las tasas de inflación (2019 - 2026) contra el rango meta de política monetaria (1.0% - 3.0%).</p>
          </header>

          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <p className="text-xs text-slate-400 font-semibold uppercase">Último Dato ({metrics.latest.year})</p>
              <p className="text-3xl font-extrabold text-white mt-2">{metrics.latest.range}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <p className="text-xs text-slate-400 font-semibold uppercase">Pico Máximo ({metrics.peak.year})</p>
              <p className="text-3xl font-extrabold text-amber-400 mt-2">{metrics.peak.range}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <p className="text-xs text-slate-400 font-semibold uppercase">Promedio Periodo</p>
              <p className="text-3xl font-extrabold text-white mt-2">{metrics.avg}%</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              <p className="text-xs text-slate-400 font-semibold uppercase">En Meta BCRP (1%-3%)</p>
              <p className="text-3xl font-extrabold text-emerald-400 mt-2">{metrics.withinTargetPct}%</p>
            </div>
          </section>

          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-lg font-bold text-white">Evolución Histórica vs Rango Meta</h2>
              <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                <button onClick={() => setChartType('area')} className={`px-3 py-1.5 rounded-lg ${chartType === 'area' ? 'bg-slate-800 text-amber-400' : 'text-slate-400'}`}>Área</button>
                <button onClick={() => setChartType('bar')} className={`px-3 py-1.5 rounded-lg ${chartType === 'bar' ? 'bg-slate-800 text-amber-400' : 'text-slate-400'}`}>Barras</button>
              </div>
            </div>
            <div className="h-72 w-full">
              <ResponsiveContainer width="100%" height="100%">
                {chartType === 'area' ? (
                  <AreaChart data={INFLATION_DATA}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.5} />
                    <XAxis dataKey="year" stroke="#94a3b8" />
                    <YAxis stroke="#94a3b8" unit="%" domain={[0, 8]} />
                    <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff' }} />
                    <ReferenceArea y1={1.0} y2={3.0} fill="#10b981" fillOpacity={0.15} />
                    <Area type="monotone" dataKey="rate" stroke="#f59e0b" fill="#f59e0b" fillOpacity={0.2} strokeWidth={3} />
                  </AreaChart>
                ) : (
                  <BarChart data={INFLATION_DATA}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.5} />
                    <XAxis dataKey="year" stroke="#94a3b8" />
                    <YAxis stroke="#94a3b8" unit="%" domain={[0, 8]} />
                    <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff' }} />
                    <ReferenceArea y1={1.0} y2={3.0} fill="#10b981" fillOpacity={0.15} />
                    <Bar dataKey="rate" fill="#f59e0b" radius={[6, 6, 0, 0]} />
                  </BarChart>
                )}
              </ResponsiveContainer>
            </div>
          </section>

          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold text-white">Tabla de Datos de Inflación</h3>
              <input 
                type="text" 
                placeholder="Buscar..." 
                value={searchTerm} 
                onChange={(e) => setSearchTerm(e.target.value)} 
                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white"
              />
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                  <tr>
                    <th className="p-3">Año</th>
                    <th className="p-3">Inflación (%)</th>
                    <th className="p-3">Estado Rango Meta</th>
                    <th className="p-3">Notas</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredData.map((row, idx) => (
                    <tr key={idx}>
                      <td className="p-3 font-bold text-white">{row.year}</td>
                      <td className="p-3 font-extrabold text-amber-400">{row.range}</td>
                      <td className="p-3">
                        {row.rate >= 1.0 && row.rate <= 3.0 ? (
                          <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-[10px]">Dentro Meta</span>
                        ) : (
                          <span className="px-2 py-0.5 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full text-[10px]">Fuera Meta</span>
                        )}
                      </td>
                      <td className="p-3 text-slate-400">{row.note}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
```
